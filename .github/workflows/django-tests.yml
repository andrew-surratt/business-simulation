name: Django Tests & Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django coverage psycopg2-binary

      - name: Run Django migrations
        env:
          DEBUG: False
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        run: |
          python manage.py migrate

      - name: Run tests with coverage
        env:
          DEBUG: False
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        run: |
          coverage run --source='business' manage.py test business
          coverage report

      - name: Generate coverage report
        if: always()
        run: |
          coverage json -o coverage.json
          coverage report --fail-under=80

      - name: Comment on PR with test results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let coverage = '❌ Coverage percentage unavailable';
            try {
              const data = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
              const percentage = Number(data.totals.percent_covered).toFixed(2);
              coverage = `✅ Code coverage: **${percentage}%**`;
            } catch (e) {
              core.warning(`Could not read coverage report: ${e.message}`);
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Test Results\n\n${coverage}\n\nThe workflow requires at least 80% coverage.`
            });
