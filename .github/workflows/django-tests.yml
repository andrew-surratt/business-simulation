name: Django Tests & Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: business_dashboard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked test dependencies
        run: uv sync --locked --group test

      - name: Run Django migrations
        env:
          DEBUG: False
          POSTGRES_DB: business_dashboard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
        run: uv run --locked python manage.py migrate

      - name: Run tests with coverage
        env:
          DEBUG: False
          POSTGRES_DB: business_dashboard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
        run: make test

      - name: Generate coverage report
        if: always()
        run: uv run --locked coverage json -o coverage.json

      - name: Comment on PR with test results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let coverage = '❌ Coverage percentage unavailable';
            try {
              const data = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
              const percentage = Number(data.totals.percent_covered).toFixed(2);
              coverage = `✅ Code coverage: **${percentage}%**`;
            } catch (e) {
              core.warning(`Could not read coverage report: ${e.message}`);
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Test Results\n\n${coverage}\n\nThe workflow requires at least 80% coverage.`
            });
