[project]
name = "business-simulation-dashboard"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crispy-bootstrap5==2025.6",
    "django~=5.2.0",
    "django-crispy-forms==2.4",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
test = [
    "coverage>=7.0,<8.0",
]

[tool.coverage.run]
source = ["business"]
omit = ["business/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
